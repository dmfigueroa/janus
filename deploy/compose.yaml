# Transition stack for the existing Janus Coolify application only.
# Coolify builds these services on its build server and deploys to its deployment server.
services:
  v1:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: /app/storage/sqlite.db
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      COMICVINE_API_KEY: ${COMICVINE_API_KEY:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    volumes:
      - database:/app/storage
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
  v2:
    build:
      context: ..
      dockerfile: v2/Dockerfile
    depends_on:
      v1:
        condition: service_healthy
    restart: unless-stopped
    environment:
      JANUS_V2_BIND: 0.0.0.0:3001
      DATABASE_URL: /app/storage/sqlite.db
    volumes:
      - database:/app/storage
    expose:
      - "3001"
    labels:
      - traefik.enable=true
      - traefik.http.routers.janus-v2.rule=Host(`janus.dmfigueroa.com`) && (Path(`/v2`) || PathPrefix(`/v2/`))
      - traefik.http.routers.janus-v2.entrypoints=https
      - traefik.http.routers.janus-v2.tls=true
      - traefik.http.routers.janus-v2.priority=1000
      - traefik.http.routers.janus-v2.service=janus-v2
      - traefik.http.services.janus-v2.loadbalancer.server.port=3001
    # Image healthcheck proves smoke liveness, not database or feature readiness.
volumes:
  database:
    external: true
    name: h8gsos0k40kk8s8oo8o4ko0w-DB
