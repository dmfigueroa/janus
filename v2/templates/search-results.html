<section id="search-results" class="search-results" aria-live="polite">
  {% if view.status_message != "" %}
  <p class="search-status" role="{{ view.status_role }}">{{ view.status_message }}</p>
  {% endif %} {% if view.empty_hint != "" %}
  <p class="search-status">{{ view.empty_hint }}</p>
  {% endif %} {% if view.hits.len() > 0 || view.has_next %}
  <div id="search-grid" class="search-grid">
    {% for hit in view.hits %}
    <form class="search-hit">
      <input type="hidden" name="provider" value="{{ hit.provider }}" />
      <input type="hidden" name="providerId" value="{{ hit.provider_id }}" />
      <input type="hidden" name="mediaType" value="{{ hit.media_type }}" />
      <input type="hidden" name="title" value="{{ hit.title }}" />
      <input type="hidden" name="year" value="{{ hit.year }}" />
      <input type="hidden" name="overview" value="{{ hit.overview }}" />
      <input type="hidden" name="poster" value="{{ hit.poster }}" />
      <input type="hidden" name="backdrop" value="{{ hit.backdrop }}" />
      <input type="hidden" name="releaseDate" value="{{ hit.release_date }}" />
      <input type="hidden" name="rating" value="{{ hit.rating_label }}" />
      <button
        type="button"
        hx-get="/v2/search/detail"
        hx-include="closest form"
        hx-target="#search-dialog"
        hx-swap="innerHTML"
      >
        <span class="search-poster">
          {% if hit.has_poster %}
          <img src="{{ hit.poster }}" alt="" width="500" height="750" loading="lazy" />
          {% else %}
          <span class="search-poster-empty">No poster</span>
          {% endif %} {% if hit.has_rating %}
          <span class="search-rating" data-high="{{ hit.high_rating }}"
            >{{ hit.rating_label }}</span
          >
          {% endif %}
        </span>
        <span class="search-title">{{ hit.title }}</span>
        {% if hit.year != "" %}
        <span class="search-year">{{ hit.year }}</span>
        {% endif %}
      </button>
    </form>
    {% endfor %} {% if view.has_next %}
    <div
      id="search-more"
      class="search-more"
      hx-get="/v2/search?query={{ view.query|urlencode }}&amp;type={{ view.media_type }}&amp;page={{ view.next_page }}"
      hx-trigger="revealed"
      hx-target="this"
      hx-swap="outerHTML"
      hx-select=".search-hit, #search-more"
      hx-sync="#search-results:abort"
      role="status"
      aria-label="Loading more results"
    >
      <span class="htmx-indicator">Loading more...</span>
    </div>
    {% endif %}
  </div>
  {% endif %}
</section>
