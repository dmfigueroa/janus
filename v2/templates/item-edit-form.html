<form
  id="item-edit-form"
  class="dialog-form"
  method="post"
  action="{{form.action}}"
  hx-post="{{form.action}}"
  hx-target="#item-edit-form"
  hx-swap="outerHTML"
  hx-disabled-elt="#item-edit-dialog button"
  hx-indicator="#item-edit-form-pending"
  data-item-id="{{form.item_id}}"
  data-item-title="{{form.item_title}}"
  {%
  if
  form.error.is_some()
  %}aria-describedby="item-edit-form-error"
  {%
  endif
  %}
>
  <fieldset class="dialog-fields">
    <legend class="visually-hidden">Edit watchlist item</legend>
    <div class="form-field">
      <label for="item-edit-title">Title</label>
      <input
        id="item-edit-title"
        name="title"
        type="text"
        value="{{form.title}}"
        autocomplete="off"
        required
        {%
        if
        form.invalid_field.is_none()
        ||
        form.title_invalid()
        %}autofocus{%
        endif
        %}
        {%
        if
        form.title_invalid()
        %}aria-invalid="true"
        {%
        endif
        %}
      />
    </div>
    <div class="form-field">
      <label for="item-edit-release-date">Release date</label>
      <div class="date-field-control">
        <input
          id="item-edit-release-date"
          name="releaseDate"
          type="text"
          value="{{form.release_date}}"
          placeholder="YYYY-MM-DD or YYYY"
          inputmode="numeric"
          autocomplete="off"
          {%
          if
          form.release_date_invalid()
          %}autofocus
          aria-invalid="true"
          {%
          endif
          %}
        />
        <button type="button" class="field-clear" data-clear-release-date aria-label="Clear date">
          Clear date
        </button>
      </div>
    </div>
    <div class="form-field">
      <label for="item-edit-poster">Poster image</label>
      <input
        id="item-edit-poster"
        name="posterPath"
        type="text"
        value="{{form.poster_path}}"
        placeholder="https://... or /poster.jpg"
        autocomplete="off"
        {%
        if
        form.poster_invalid()
        %}autofocus
        aria-invalid="true"
        {%
        endif
        %}
      />
      <div
        class="poster-preview-wrap"
        data-poster-preview-wrap
        {%
        if
        form.poster_preview_url.is_none()
        %}hidden{%
        endif
        %}
      >
        <img
          class="poster-preview"
          data-poster-preview
          src="{{form.poster_preview_src()}}"
          alt="Poster preview for {{form.item_title}}"
          referrerpolicy="no-referrer"
        />
      </div>
    </div>
  </fieldset>
  <p id="item-edit-form-error" class="form-error" role="alert">
    {% if let Some(error) = form.error %}{{error}}{% endif %}
  </p>
  <footer class="dialog-footer" aria-live="polite">
    <span id="item-edit-form-pending" class="htmx-indicator" role="status">Saving…</span>
    <button
      type="button"
      class="button-secondary"
      commandfor="item-edit-dialog"
      command="request-close"
      data-item-edit-dialog-close
    >
      Cancel
    </button>
    <button type="submit" class="button-primary">Save</button>
  </footer>
</form>
