<dialog
  id="item-edit-dialog"
  class="dialog"
  closedby="any"
  aria-labelledby="item-edit-dialog-title"
  aria-describedby="item-edit-dialog-help"
  data-item-edit-dialog
>
  <header class="dialog-header">
    <h2 id="item-edit-dialog-title">Edit watchlist item</h2>
    <p id="item-edit-dialog-help" class="dialog-help">
      Update this item’s title, release date, and poster image.
    </p>
  </header>
  <button
    type="button"
    class="dialog-close"
    data-item-edit-dialog-close
    aria-label="Close edit dialog"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      width="16"
      height="16"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    >
      <line x1="6" y1="6" x2="18" y2="18"></line>
      <line x1="18" y1="6" x2="6" y2="18"></line>
    </svg>
  </button>
  <form id="item-edit-form" class="dialog-form"></form>
</dialog>
