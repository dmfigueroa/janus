<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Watchlists · Janus</title>
    <link rel="stylesheet" href="/v2/static/app.css" />
  </head>
  <body>
    <main class="watchlist">
      <nav><a href="/">Janus v1</a></nav>
      <h1>Watchlists</h1>
      <form method="get">
        <label for="query">Search watchlists</label
        ><input name="query" id="query" type="search" value="{{query}}" /><button>Search</button>
      </form>
      {% for list in lists %}
      <article>
        <div class="item-content">
          <h2><a href="/v2/watchlists/{{list.id}}">{{list.name}}</a></h2>
          <p>{{list.watched}} of {{list.total}} watched</p>
        </div>
      </article>
      {% else %}
      <p role="status">No watchlists found.</p>
      {% endfor %}{% if !next.is_empty() %}
      <form method="get">
        <input type="hidden" name="query" value="{{query}}" /><input
          type="hidden"
          name="cursor"
          value="{{next}}"
        /><button>Next page</button>
      </form>
      {% endif %}
    </main>
  </body>
</html>
