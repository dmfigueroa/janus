<dialog
  id="watchlist-dialog"
  class="dialog"
  closedby="any"
  aria-labelledby="watchlist-dialog-title"
  aria-describedby="watchlist-dialog-help{% if form.error.is_some() %} watchlist-form-error{% endif %}"
  data-watchlist-dialog
>
  <header class="dialog-header">
    <h2 id="watchlist-dialog-title">{{form.title}}</h2>
    <p id="watchlist-dialog-help" class="dialog-help">{{form.help}}</p>
  </header>
  <button
    type="button"
    class="dialog-close"
    commandfor="watchlist-dialog"
    command="request-close"
    data-watchlist-dialog-close
    aria-label="Close dialog"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      width="16"
      height="16"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    >
      <line x1="6" y1="6" x2="18" y2="18"></line>
      <line x1="18" y1="6" x2="6" y2="18"></line>
    </svg>
  </button>
  {% include "watchlist-form.html" %}
</dialog>
