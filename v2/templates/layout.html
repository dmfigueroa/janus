<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="htmx-config" content='{"disableInheritance":true}' />
    <title>{% block title %}Janus{% endblock %}</title>
    <link rel="stylesheet" href="{{ crate::assets::VENDOR_OPEN_PROPS_MIN_CSS_URL }}" />
    <link rel="stylesheet" href="{{ crate::assets::APP_CSS_URL }}" />
    <script defer src="{{ crate::assets::VENDOR_HTMX_MIN_JS_URL }}"></script>
    <script defer src="{{ crate::assets::VENDOR_SORTABLE_MIN_JS_URL }}"></script>
    <script type="module" src="{{ crate::assets::WATCHLIST_DIALOG_JS_URL }}"></script>
    <script type="module" src="{{ crate::assets::APP_JS_URL }}"></script>
    <script type="importmap">
      {
        "imports": {
          "@janus/watchlist-reorder-groups": "{{ crate::assets::WATCHLIST_REORDER_GROUPS_JS_URL|safe }}",
          "@janus/item-edit-fields": "{{ crate::assets::ITEM_EDIT_FIELDS_JS_URL|safe }}"
        }
      }
    </script>
    <script type="module" src="{{ crate::assets::WATCHLIST_REORDER_JS_URL }}"></script>
    <script type="module" src="{{ crate::assets::ITEM_EDIT_DIALOG_JS_URL }}"></script>
    {% block scripts %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %} {% include "bottom-nav.html" %}
    <p id="notification" class="notification" role="status" aria-live="polite" hidden></p>
    <p id="request-error" class="request-error" role="alert" hidden>
      Request failed. Please try again.
    </p>
  </body>
</html>
