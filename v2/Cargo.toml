[package]
name = "janus-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
unicode-normalization = "0.1"
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
askama = "=0.16.1"
sea-orm = { version = "=2.0.4", default-features = false, features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
] }
rmcp = { version = "=3.9.0", features = ["transport-streamable-http-server"] }
uuid = { version = "1.29.3", features = ["v4"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
