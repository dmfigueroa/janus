name: Rust v2
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  format:
    name: Rust Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "v2 -> target"
          shared-key: v2-debug
          save-if: "false"
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "v2 -> target"
          shared-key: v2-debug
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
        working-directory: .
      - run: cargo test --locked
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'push'
        with:
          workspaces: "v2 -> target"
          shared-key: v2-release
      - run: cargo build --locked --release
        if: github.event_name == 'push'
