name: Rust v2
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  format:
    name: Rust Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "v2 -> target"
          shared-key: v2-debug
          save-if: "false"
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "v2 -> target"
          shared-key: v2-debug
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
        working-directory: .
      - run: cargo test --locked
      - name: Install browsers
        run: npx playwright-core install --with-deps chromium webkit
      - name: Browser tests
        env:
          PLAYWRIGHT_BROWSERS: chromium,webkit
        run: node --test tests/browse-browser.cjs tests/watchlist-form-browser.cjs tests/reorder-browser.cjs tests/dialog-layout-browser.cjs tests/layout-browser.cjs tests/watchlists-home-browser.cjs
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-browser-failure-screenshots
          path: v2/tests/artifacts
          if-no-files-found: ignore
          retention-days: 7
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'push'
        with:
          workspaces: "v2 -> target"
          shared-key: v2-release
      - run: cargo build --locked --release
        if: github.event_name == 'push'

  image:
    name: Rust Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v2 image
        run: docker build -f v2/Dockerfile -t janus-v2:ci .
