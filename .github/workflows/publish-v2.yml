name: Publish v2 image

on:
  push:
    branches: [main]
    tags:
      - "v2/*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-v2
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dmfigueroa/janus

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter v2 paths
        id: filter
        if: github.ref_type == 'branch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            v2:
              - v2/**
              - .dockerignore
              - .github/workflows/publish-v2.yml

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.v2 }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and push v2
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v2 SemVer image tags are 2.x.y-beta for now (prerelease channel).
      - name: Parse v2 SemVer tag
        id: semver
        if: startsWith(github.ref, 'refs/tags/v2/')
        run: |
          version="${GITHUB_REF_NAME#v2/}"
          case "$version" in
            2.*.*)
              echo "tag=${version}-beta" >> "$GITHUB_OUTPUT"
              echo "minor=${version%.*}-beta" >> "$GITHUB_OUTPUT"
              echo "major=2-beta" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "v2 SemVer tags must be v2/2.x.y (got v2/${version})" >&2
              exit 1
              ;;
          esac

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-v2-,format=short
            type=raw,value=next,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v2/') }}
            type=raw,value=${{ steps.semver.outputs.tag }},enable=${{ steps.semver.outputs.tag != '' }}
            type=raw,value=${{ steps.semver.outputs.minor }},enable=${{ steps.semver.outputs.minor != '' }}
            type=raw,value=${{ steps.semver.outputs.major }},enable=${{ steps.semver.outputs.major != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v2/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=janus-v2
          cache-to: type=gha,mode=max,scope=janus-v2
